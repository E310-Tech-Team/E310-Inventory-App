events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream postgrest_backend {
        server rest:3000;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name localhost;

        # Healthcheck endpoint
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"supabase-gateway"}';
        }

        # Supabase REST API route: maps /rest/v1/* -> postgrest /*
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://postgrest_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Disable buffering for real-time/streaming responses
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Root fallback information
        location / {
            default_type application/json;
            return 200 '{"message":"E310 Supabase API Gateway is running","rest_api":"/rest/v1/"}';
        }
    }
}

